version: "3.8"

services:
  app:
    depends_on:
      postgres:
        condition: service_started
      catto-filters:
        condition: service_healthy

  postgres:
    image: postgres:latest
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - 6432:5432
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass

  redis:
    image: redis:latest

  # Reads the translatable text out of files and writes translations back (Okapi, no XLIFF).
  # The image with LibreOffice (default build target) also handles doc/xls/ppt/rtf; it needs about 2 GB.
  catto-filters:
    build:
      context: ../catto-filters
    ports:
      - 8735:8080
    environment:
      - JAVA_OPTS=-Xmx1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g

  # libretranslate:
  #   container_name: libretranslate
  #   image: libretranslate/libretranslate:latest
  #   ports:
  #     - "6002:5000"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']
  #     interval: 10s
  #     timeout: 4s
  #     retries: 4
  #     start_period: 5s

  libretranslate-cuda:
    image: libretranslate/libretranslate:latest-cuda
    ports:
      - "6003:5000"
    restart: unless-stopped
    command: --disable-web-ui
    environment:
    #  - LT_API_KEYS_DB_PATH=/app/db/api_keys.db
    #  - LT_API_KEYS=True
    #  - LT_REQ_LIMIT=120
     - LT_UPDATE_MODELS=True
     - LT_DEBUG=True
     - NVIDIA_DISABLE_REQUIRE=true
     - PUID=root
    volumes:
     - ./.libretranslate-data/db:/app/db
     - ./.libretranslate-data/data:/root/.local:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]